[package]
name = "walkmanager-api"
version.workspace = true
edition.workspace = true

[[bin]]
name = "walkmanager-api"
path = "src/main.rs"

[[bin]]
name = "walkmanager-seed"
path = "src/bin/seed.rs"

[dependencies]
walkmanager-domain = { path = "../walkmanager-domain" }
walkmanager-application = { path = "../walkmanager-application" }
walkmanager-infrastructure = { path = "../walkmanager-infrastructure" }
sea-orm = { version = "0.12", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
dotenvy = "0.15"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
time.workspace = true
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
jsonwebtoken = { version = "9.0", features = ["pem"] }
axum-extra = "0.9"
utoipa = { version = "4.0", features = ["axum_extras"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { workspace = true, features = ["v4"] }
thiserror.workspace = true

[dev-dependencies]
tokio.workspace = true
