          type: string
          format: date-time
          nullable: true
    PagedChatMessages:
      type: object
      required: [items, page, pageSize, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        page: { type: integer }
        pageSize: { type: integer }
        totalCount: { type: integer }
    CreateReviewRequest:
      type: object
      required: [rating, comment]
      properties:
