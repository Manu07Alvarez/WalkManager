          type: string
          enum: [Pending, Approved, Rejected]
    ModerationDecisionRequest:
      type: object
      properties:
        notes: { type: string }
    PagedNotifications:
      type: object
      required: [items, page, pageSize, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        page: { type: integer }
        pageSize: { type: integer }
        totalCount: { type: integer }
    NotificationPreference:
      type: object
      required: [channel]
      properties:
        channel:
          type: string
          enum: [Email, PhoneMessaging]
    UpdateNotificationPreferenceRequest:
      type: object
      required: [channel]
      properties:
        channel:
          type: string
          enum: [Email, PhoneMessaging]
    Notification:
      type: object
      required: [id, type, channel, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        channel:
          type: string
          enum: [Email, PhoneMessaging]
        status:
          type: string
          enum: [Pending, Sent, Failed]
        createdAt: { type: string, format: date-time }
    IncidentRecord:
      type: object
      required: [id, userAccountId, incidentType, severity, createdAt]
