        userAccountId: { type: string, format: uuid }
        bookingId:
          type: string
          format: uuid
          nullable: true
        incidentType:
          type: string
          enum: [NoShow, LateCancellation, DisputedService, RepeatedFailure, RepeatedRejection]
        severity:
          type: string
          enum: [Low, Medium, High]
        description: { type: string }
        createdAt: { type: string, format: date-time }
        resolvedAt:
          type: string
          format: date-time
          nullable: true
    PagedIncidentRecords:
      type: object
      required: [items, page, pageSize, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IncidentRecord'
        page: { type: integer }
        pageSize: { type: integer }
        totalCount: { type: integer }
    ModeratorWorkItem:
      type: object
      required: [id, workItemType, status, summary, createdAt]
      properties:
        id: { type: string, format: uuid }
        workItemType:
          type: string
          enum: [Report, DisputedService, RestrictionReview, SuspensionReview, ReviewModeration]
        status:
          type: string
          enum: [Open, Assigned, Resolved]
        subjectUserAccountId:
          type: string
          format: uuid
          nullable: true
        relatedBookingId:
          type: string
          format: uuid
          nullable: true
        relatedReviewId:
          type: string
          format: uuid
          nullable: true
        assignedModeratorUserId:
          type: string
          format: uuid
          nullable: true
        summary: { type: string }
        resolutionNotes:
          type: string
          nullable: true
        createdAt: { type: string, format: date-time }
        assignedAt:
          type: string
          format: date-time
          nullable: true
        resolvedAt:
          type: string
          format: date-time
          nullable: true
    PagedModeratorWorkItems:
      type: object
      required: [items, page, pageSize, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ModeratorWorkItem'
        page: { type: integer }
        pageSize: { type: integer }
        totalCount: { type: integer }
    ResolveWorkItemRequest:
      type: object
      required: [resolutionNotes]
      properties:
        resolutionNotes: { type: string }
        resolvedServiceResult:
          type: string
          enum: [Successful, CustomerAbsent, WalkerAbsent, Failed]
          nullable: true
    ApplyRestrictionRequest:
      type: object
      required: [userAccountId, restrictionType, reason, startsAt]
      properties:
        userAccountId: { type: string, format: uuid }
        restrictionType:
          type: string
          enum: [Warning, ReducedBookingCapabilities, VisibilityReduction, MessagingRestriction, TemporarySuspension]
        reason: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt:
          type: string
          format: date-time
          nullable: true
    AccountRestriction:
      type: object
      required: [id, userAccountId, restrictionType, reason, startsAt, isActive]
      properties:
        id: { type: string, format: uuid }
        userAccountId: { type: string, format: uuid }
        restrictionType:
          type: string
          enum: [Warning, ReducedBookingCapabilities, VisibilityReduction, MessagingRestriction, TemporarySuspension]
        reason: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt:
          type: string
          format: date-time
          nullable: true
        isActive: { type: boolean }
