          examples:
            - CUIL_ALREADY_REGISTERED
            - WALKER_UNAVAILABLE
            - BOOKING_CAPACITY_EXCEEDED
            - INVALID_BOOKING_STATUS_TRANSITION
            - INVALID_SERVICE_RESULT_TRANSITION
            - ACCOUNT_RESTRICTED
            - REVIEW_NOT_ALLOWED
        message: { type: string }
        details:
          type: object
          additionalProperties: true
